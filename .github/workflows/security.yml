name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Varre os arquivos .tf em busca de falhas de segurança de infraestrutura.
      - name: Run Trivy scanner (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          format: "sarif"
          output: "trivy-results.sarif"

      # Envia os resultados do Terraform para o painel do GitHub
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
