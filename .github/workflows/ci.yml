name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate realm JSON
        run: python3 -m json.tool keycloak/realm-export.json > /dev/null

      - name: Build image (sem push)
        run: docker build -t idp-validate .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5" # required version

      - name: Terraform format check
        working-directory: iac
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate
