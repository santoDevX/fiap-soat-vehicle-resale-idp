info:
  name: Login novo usuario
  type: http
  seq: 5

http:
  method: post
  url: http://localhost:8081/realms/vehicle-resale/protocol/openid-connect/token
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: vehicle-resale-client
      - name: username
        value: novo.usuario
      - name: password
        value: senha123
      - name: grant_type
        value: password
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("novo_token", res.body.access_token);

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
