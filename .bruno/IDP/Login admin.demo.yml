info:
  name: Login admin.demo
  type: http
  seq: 2

http:
  method: post
  url: http://localhost:8081/realms/vehicle-resale/protocol/openid-connect/token
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: vehicle-resale-client
      - name: username
        value: admin.demo
      - name: password
        value: demo123
      - name: grant_type
        value: password
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
