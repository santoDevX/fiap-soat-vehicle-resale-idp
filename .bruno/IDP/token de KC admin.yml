info:
  name: token de KC admin
  type: http
  seq: 3

http:
  method: post
  url: http://localhost:8081/realms/master/protocol/openid-connect/token
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: admin-cli
      - name: username
        value: admin
      - name: password
        value: admin_local_only
      - name: grant_type
        value: password
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("admin_token", res.body.access_token);

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
